name: Release

# `push: main` is the release trigger. changesets/action reads the tree that just landed:
# while changesets are pending it opens/updates a "Version Packages" PR; once that PR is
# merged (no changesets left) it publishes to npm and cuts the GitHub Release.
on:
  push:
    branches: [main]

# Serialize releases; never cancel a publish mid-flight. A cancelled `npm publish` can leave
# a version half-registered, so we let an in-flight run finish rather than pre-empt it.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write # create tags + GitHub Releases
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # OIDC token for npm trusted publishing (no stored NPM_TOKEN)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changesets needs full history to compute the version bump

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          # Writes the .npmrc that `npm publish` reads. Under OIDC the registry mints a
          # short-lived token itself, so no NODE_AUTH_TOKEN is set here.
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1; the runner's bundled npm is older. This
      # upgrade is the whole reason a token isn't needed. Provenance attaches automatically on
      # a public repo and is silently skipped while the repo is private -- do NOT force it with
      # NPM_CONFIG_PROVENANCE, which errors on a private repo.
      - run: npm install -g npm@latest

      - run: npm ci

      # Pending changesets on main -> `changeset version` opens/updates the "Version Packages"
      # PR. None left (that PR merged) -> `changeset publish` runs `npm publish` (whose
      # prepublishOnly re-checks and builds) and, with createGithubReleases, cuts the Release.
      #
      # `changeset version` rewrites package.json with multi-line `keywords`/`files` arrays that
      # biome's formatter collapses back to one line, so the generated "Version Packages" PR would
      # fail its own `npm run lint`. We reformat right after the bump -- but the two commands MUST
      # be wrapped in the `changeset:version` npm script: changesets/action runs this `version:`
      # input WITHOUT a shell, so a literal `&&` here is parsed as extra args to `changeset` and the
      # bump silently no-ops (it did -- that is what left #17 empty on the first attempt).
      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run changeset:version
          publish: npx changeset publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # changesets/action's `title` input is a STATIC string evaluated before `changeset
      # version` runs, so it cannot carry the bumped version. This step runs AFTER the action has
      # pushed the bumped package.json to the PR head and retitles the just-opened/updated
      # "Version Packages" PR to `release: <pkg>@<version>`, which also serves as the squash-merge
      # commit subject. Skipped on the publish push (no PR number). Single-package repo, so the
      # version is read from package.json on the PR branch via the Contents API -- a local read
      # can be stale, since actions/checkout's narrow fetch leaves origin/<branch> behind the
      # action's force-push of the bump.
      - name: Retitle the Version Packages PR with the bumped version
        if: steps.changesets.outputs.pullRequestNumber
        continue-on-error: true # a cosmetic retitle must never fail a release run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr='${{ steps.changesets.outputs.pullRequestNumber }}'
          branch=$(gh pr view "$pr" --json headRefName -q .headRefName)
          version=$(gh api "repos/${{ github.repository }}/contents/package.json?ref=$branch" \
            -H "Accept: application/vnd.github.raw" | jq -r .version)
          gh pr edit "$pr" --title "release: @epodivilov/vikunja-mcp@$version"
